# TankAlert Zephyr configuration
# Subsystems below are enabled for future modules; only logging/GPIO/UART
# are required for the current heartbeat firmware.

# --- Kernel / logging ---
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_PRINTK=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# --- Console (ESP32 UART0) ---
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# --- GPIO (water flow, sensor power, ultrasonic TRIG/ECHO) ---
CONFIG_GPIO=y

# --- I2C (MAX17048 fuel gauge) ---
CONFIG_I2C=y

# --- UART (optional JSN-SR04T serial mode) ---
CONFIG_UART_INTERRUPT_DRIVEN=y

# --- ADC (reserved for future analog front-end; not used yet) ---
# CONFIG_ADC=y

# --- Power management (light sleep / deep sleep scheduling) ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- Time / SNTP (RTC sync for sample timestamps) ---
CONFIG_POSIX_CLOCK=y
CONFIG_SNTP=y

# --- Persistent storage (NVS + settings for credentials and history) ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# --- Networking stack (Wi-Fi + MQTT planned) ---
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_CONNECTION_MANAGER=y

# --- Wi-Fi station mode ---
CONFIG_WIFI=y
CONFIG_WIFI_USAGE_MODE_STA=y

# ESP32 Wi-Fi integration (board DT enables esp32-wifi)
CONFIG_ESP32_WIFI_STA_AUTO_DHCPV4=y

# Network buffer pools (tune when MQTT is added)
CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20
CONFIG_NET_TX_STACK_SIZE=2048
CONFIG_NET_RX_STACK_SIZE=2048

# --- MQTT client library (not used by heartbeat yet) ---
CONFIG_MQTT_LIB=y

# Wi-Fi credentials: create wifi_credentials.conf locally (gitignored)
# CONFIG_WIFI_CREDENTIALS=y
# CONFIG_WIFI_CREDENTIALS_STATIC_SSID="your-ssid"
# CONFIG_WIFI_CREDENTIALS_STATIC_PASSWORD="your-password"
